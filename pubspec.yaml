name: zariya_app
description: Zariya Jewellery - Luxury Jewellery Store
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  dio: ^5.4.3+1
  speech_to_text: ^7.3.0
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  # New packages
  local_auth: ^2.3.0              # Biometric login
  flutter_secure_storage: ^10.0.0  # Secure token storage
  intl: ^0.19.0                   # i18n / date formatting
  connectivity_plus: ^6.1.1       # Offline mode detection
  razorpay_flutter: ^1.3.6         # Razorpay payment gateway
  flutter_inappwebview: ^6.0.0    # VTO WebView
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - web/vto.html
